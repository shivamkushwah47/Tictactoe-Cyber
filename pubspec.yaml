name: tictactoe_cyber
description: Cyber Edition Tic Tac Toe - Flutter Game
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  audioplayers: ^5.2.1
  shared_preferences: ^2.2.2
  flutter_animate: ^4.3.0
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png

flutter:
  uses-material-design: true